<html>
  <head>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-physics-system@v4.2.2/dist/aframe-physics-system.min.js"></script>
    <script src="player.js"></script>
    <script src="script.js"></script>
    <script src="wall.js"></script>
    <script src="hwall.js"></script>
    <script src="door.js"></script>
    <script src="jdoor.js"></script>
    <script src="brown.js"></script>
    <script src="nbrown.js"></script>
    <script src="baldi.js"></script>
    <script src="yellow.js"></script>
    <script src="kyellow.js"></script>
    <script src="desk.js"></script>
    <script src="zdesk.js"></script>
    <script src="plant.js"></script>
    <script src="lunch.js"></script>
    <script src="bsoda.js"></script> 
    <script src="trash.js"></script>
    <script src="coin.js"></script> 


  </head>
  <body>
    <a-scene physics="debug: false">
    <a-assets>
      <img id="yellow" src="yellow.png"></img>
      <img id="wood" src="wood.jpg"></img>
      <img id="wall" src="wall.jpg"></img>
      <img id="door" src="door.png"></img>
      <img id="ceiling" src="ceiling.jpg"></img>
      <img id="brown" src="brown.png"></img>
      <img id="floor" src="floor.jpg"></img>
      <a-asset-item id="notebook" src="spiral_notebook.glb" ></a-asset-item>
      <a-asset-item id="plant" src="potted_plant.glb" ></a-asset-item>
      <a-asset-item id="bsoda" src="vending_machine.glb" ></a-asset-item>
      <a-asset-item id="teacher" src="scene.gltf"></a-asset-item>
      <a-asset-item id="trash" src="trash.js"></a-asset-item>
      <a-asset-item id="gold-coin" src="bell_currencycoin_-_animal_crossing.glb" ></a-asset-item>
      
    </a-assets>
    <a-light type="ambient" intensity="0.2" color="#ffffff"></a-light>
    <a-plane static-body position="0 2.5 -4" rotation="90 0 0" width="150" height="150" src="#ceiling" repeat="50 50" side="double"></a-plane>
      <a-plane static-body position="0 0 -4" rotation="-90 0 0" width="800" height="800" src="#floor" repeat="500 500"></a-plane>

      <a-sky color="#ECECEC"></a-sky>
      <a-entity rotation="0 180 0">
        <a-camera wasd-controls="enabled:false" >
          <a-text value="books"></a-text>
          <a-cursor></a-cursor>
        </a-camera>
      </a-entity>
      

          
    </a-scene>
    <div id="notebook_text" style="position:absolute; top:20px; left:20px; color:white; font-size:50px; z-index:1000;font-family:'Comic Sans MS', cursive;">
</div>
    <div id="stamina_bar_container" style="position:absolute; top:20px; right:20px; width:200px; height:30px; border:2px solid white; background-color:rgba(0,0,0,0.5); z-index:1000;">
      <div id="stamina_bar_fill" style="height:100%; width:100%; background-color:#00FF00; transition:width 0.1s ease;"></div>
    </div>
    <div id="coin_text" style="position:absolute; top:80px; left:20px; color:white; font-size:50px; z-index:1000;font-family:'Comic Sans MS', cursive;">
</div>
  </body>
</html>
